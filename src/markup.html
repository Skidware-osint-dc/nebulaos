<!-- ===================== splash ===================== -->
<div id="splash">
  <div class="splash-inner">
    <svg class="splash-logo" viewBox="0 0 96 96"><use href="#i-logo"/></svg>
    <div class="splash-name">Nebula<span>OS</span></div>
    <div class="splash-sub">Powered by Ultraviolet &amp; Scramjet on the Wisp protocol</div>
    <div class="splash-bar"><i id="splash-progress"></i></div>
    <div class="splash-status" id="splash-status">Booting kernel…</div>
    <div id="boot-log"></div>
  </div>
</div>

<!-- ===================== desktop ===================== -->
<div id="wallpaper"></div>
<div id="icons" aria-label="Desktop icons"></div>
<div id="marquee"></div>

<header id="bar">
  <div id="bar-left">
    <button class="bar-btn" id="btn-activities" title="Activities (Ctrl+Space)">
      <svg><use href="#i-grid"/></svg><span id="activites-label">Activities</span>
    </button>
    <button class="bar-btn" id="btn-new-window" title="Open a new window (Ctrl+Alt+T for terminal)">
      <svg><use href="#i-plus"/></svg>
    </button>
    <span class="bar-sep" aria-hidden="true"></span>
    <button class="bar-btn" id="btn-bar-browser" title="Open the proxied browser (Ctrl+Alt+B)">
      <svg><use href="#i-globe"/></svg><span class="bar-label">Browser</span>
    </button>
    <button class="bar-btn" id="btn-bar-apps" title="Open the app grid (Ctrl+Space)">
      <svg><use href="#i-apps"/></svg><span class="bar-label">Apps</span>
    </button>
    <button class="bar-btn" id="btn-bar-games" title="Open Games">
      <svg><use href="#i-gamepad"/></svg><span class="bar-label">Games</span>
    </button>
    <button class="bar-btn" id="btn-bar-discord" title="Open Discord through the proxy">
      <svg><use href="#i-discord"/></svg><span class="bar-label">Discord</span>
    </button>
    <div id="focus-wrap" class="row" style="gap:6px;min-width:0">
      <span id="focus-app">Desktop</span>
      <span id="focus-sub" class="nowrap"></span>
    </div>
  </div>

  <div id="bar-center">
    <button class="bar-btn" id="btn-clock" title="Date &amp; time">
      <span id="clock-time">--:--</span><span id="clock-date"></span>
    </button>
  </div>

  <div id="bar-right">
    <div id="tray-status" title="Proxy status">
      <span class="bar-badge" id="badge-proxy"><span class="dot"></span><span id="badge-proxy-text">Proxy: off</span></span>
    </div>
    <button class="bar-btn" id="btn-quicktheme" title="Cycle theme"><svg><use href="#i-palette"/></svg></button>
    <button class="bar-btn" id="btn-cloak" title="Tab cloak / about:blank"><svg><use href="#i-eye-off"/></svg></button>
    <button class="bar-btn" id="btn-settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
    <button class="bar-btn" id="btn-power" title="Session"><svg><use href="#i-power"/></svg></button>
  </div>
</header>

<div id="windows"></div>
<div id="snap-preview"></div>
<nav id="dock"></nav>

<!-- ===================== launcher ===================== -->
<div id="launcher">
  <div class="scrim" data-close="1"></div>
  <div class="panel glass-strong">
    <div class="lhead">
      <div class="ltitle">
        <svg style="width:20px;height:20px" viewBox="0 0 96 96"><use href="#i-logo"/></svg>
        <span>NebulaOS</span>
        <span class="muted" style="font-weight:500;font-size:12.5px" id="launcher-hint">Search apps, games, files and settings</span>
      </div>
      <div class="lsearch">
        <svg style="width:17px;height:17px;opacity:.6"><use href="#i-search"/></svg>
        <input id="launcher-input" placeholder="Type to search…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
    </div>
    <div class="lbody" id="launcher-body"></div>
    <div class="lfoot">
      <span><kbd>Enter</kbd> open</span><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>Ctrl</kbd>+<kbd>Space</kbd> toggle</span>
      <span class="grow"></span><span id="launcher-clock" class="mono"></span>
    </div>
  </div>
</div>

<div id="overlays"><div id="toasts"></div></div>
<div id="ctxmenu"></div>
