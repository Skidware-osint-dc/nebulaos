    // =========================
    // SERVICE WORKER REGISTRATION (fixed path issues)
    // =========================
    async function registerSW() {
        if (!("serviceWorker" in navigator)) {
            console.warn("Service workers not supported");
            return;
        }
        try {
            // Ensure we register only if sw.js actually exists; prevent errors if missing
            const reg = await navigator.serviceWorker.register("/sail/sw.js", {
                scope: "/sail/"
            }).catch(() => null);
            if (reg) {
                console.log("SW registered at scope:", reg.scope);
                await navigator.serviceWorker.ready;
                console.log("SW ready. Controller:", navigator.serviceWorker.controller);
            } else {
                console.log("SW not present, continuing without.");
            }
        } catch (err) {
            console.error("SW registration failed (non-critical):", err);
        }
    }
    registerSW();
</script>

<script>
    // =========================
    // VANTA FOG BACKGROUND (fixed to avoid errors)
    // =========================
    if (typeof VANTA !== 'undefined' && VANTA.FOG) {
        VANTA.FOG({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            highlightColor: 0xff5b2e,
            midtoneColor: 0x220000,
            lowlightColor: 0x000000,
            baseColor: 0x000000
        });
    } else {
        document.getElementById('vanta-bg').style.backgroundColor = "#050505";
    }

    // =========================
    // UTILITIES: TIME, PRIVACY, SCREENSAVER
    // =========================
    function updateDateTime() {
        const now = new Date();
        const dateElem = document.getElementById('date');
        const clockElem = document.getElementById('clock');
        if (dateElem) dateElem.innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        if (clockElem) clockElem.innerText = now.toUTCString().split(' ')[4];
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // Privacy mode toggle
    const privacyBtn = document.getElementById('privacyBtn');
    privacyBtn.addEventListener('click', () => {
        document.body.classList.toggle('privacy');
    });

    // Screensaver idle logic (after 60 seconds)
    let idleTimeout;
    const screensaverDiv = document.getElementById('screensaver');
    function resetIdleTimer() {
        if (idleTimeout) clearTimeout(idleTimeout);
        if (screensaverDiv) screensaverDiv.style.display = 'none';
        idleTimeout = setTimeout(() => {
            if (screensaverDiv && document.visibilityState === 'visible') {
                const bigClock = document.getElementById('bigClockDisplay');
                const bigDate = document.getElementById('bigDateDisplay');
                const now = new Date();
                if (bigClock) bigClock.innerText = now.toUTCString().split(' ')[4];
                if (bigDate) bigDate.innerText = now.toLocaleDateString();
                screensaverDiv.style.display = 'flex';
            }
        }, 60000);
    }
    window.addEventListener('load', resetIdleTimer);
    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('keydown', resetIdleTimer);
    window.addEventListener('click', resetIdleTimer);
    if (screensaverDiv) screensaverDiv.addEventListener('click', () => {
        screensaverDiv.style.display = 'none';
        resetIdleTimer();
    });

    // =========================
    // PROXY CORE (Fully Fixed: Proper global detection and fallbacks)
    // =========================
    const DEFAULT_WS = "wss://wisp.mercurywork.shop/";
    let websocketURL = localStorage.getItem("websocketURL") || DEFAULT_WS;
    let scramjet = null;
    let scramjetReady = false;
    let connection = null;
    let proxyReady = false;
    let proxyInitPromise = null;

    async function initProxyStack() {
        if (proxyInitPromise) return proxyInitPromise;
        proxyInitPromise = (async () => {
            try {
                // Check required global objects and libraries
                if (typeof $scramjetLoadController !== 'function') {
                    console.warn("Scramjet controller not available; proxy will be disabled");
                    scramjetReady = false;
                    proxyReady = false;
                    return;
                }
                const { ScramjetController } = $scramjetLoadController();
                if (!ScramjetController) throw new Error("ScramjetController missing");
                scramjet = new ScramjetController({
                    files: {
                        all: "/sail/scram/scramjet.all.js",
                        wasm: "/sail/scram/scramjet.wasm.wasm",
                        sync: "/sail/scram/scramjet.sync.js"
                    },
                    prefix: "/sail/go/"
                });
                await scramjet.init();
                scramjetReady = true;
                console.log("✔ Scramjet ready");

                if (typeof BareMux === 'undefined' || !BareMux.BareMuxConnection) {
                    console.warn("BareMux not loaded; proxy cannot establish connection.");
                    proxyReady = false;
                    return;
                }
                connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");
                await connection.setTransport("/sail/libcurl/index.mjs", [{
                    websocket: websocketURL
                }]);
                proxyReady = true;
                console.log("✔ BareMux ready, proxy active");
            } catch (err) {
                console.error("❌ Proxy init failed:", err);
                scramjetReady = false;
                proxyReady = false;
            }
        })();
        return proxyInitPromise;
    }

    function requireProxy() {
        if (!scramjetReady || !proxyReady) {
            alert("Proxy still loading or unavailable. Retry in a moment.");
            return false;
        }
        return true;
    }

    function normalizeUrl(value) {
        value = value.trim();
        if (!value) return '';
        if (!value.includes('.') && !value.startsWith('http') && !value.includes('://')) {
            return "https://search.brave.com/search?q=" + encodeURIComponent(value);
        }
        if (!/^https?:\/\//i.test(value)) {
            return "https://" + value;
        }
        return value;
    }

    function getEncodedProxyUrl(rawUrl) {
        if (!rawUrl) return '';
        if (!scramjetReady || !scramjet || typeof scramjet.encodeUrl !== 'function') {
            console.warn("Scramjet encodeUrl not ready");
            return '';
        }
        try {
            return scramjet.encodeUrl(rawUrl);
        } catch (e) {
            console.error("encodeUrl failed:", e);
            return '';
        }
    }

    // =========================
    // TAB SYSTEM (Fixed duplicates and bookmark navigation)
    // =========================
    const homePanel = document.getElementById('homePanel');
    const browserFrame = document.getElementById('frame');
    const urlInputElem = document.getElementById('urlInput');
    const tabsContainer = document.getElementById('tabsContainer');
    const addTabBtn = document.getElementById('addTab');

    let activeTabId = 0;
    let tabs = [{ id: 0, url: '', title: 'ӊөӎє' }];

    function loadTab(tabId) {
        const tab = tabs.find(t => t.id === tabId);
        if (!tab) return;
        activeTabId = tabId;
        if (tab.url && tab.url.trim() !== '') {
            homePanel.style.display = 'none';
            browserFrame.style.display = 'block';
            const proxyUrl = getEncodedProxyUrl(tab.url);
            if (proxyUrl) {
                browserFrame.src = proxyUrl;
            } else {
                browserFrame.src = "about:blank";
                console.warn("Invalid proxy url for", tab.url);
            }
            urlInputElem.value = tab.url;
        } else {
            browserFrame.style.display = 'none';
            homePanel.style.display = 'flex';
            browserFrame.src = 'about:blank';
            urlInputElem.value = '';
        }
        updateTabsUI();
    }

    function updateTabsUI() {
        const existing = document.querySelectorAll('.tab:not([data-addbtn])');
        existing.forEach(el => el.remove());
        tabs.forEach(tab => {
            const el = document.createElement('div');
            el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
            const titleSpan = document.createElement('span');
            let name = tab.title || 'tab';
            if (name.length > 18) name = name.slice(0, 15) + '..';
            titleSpan.innerText = name;
            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '×';
            el.appendChild(titleSpan);
            el.appendChild(closeSpan);
            el.onclick = (e) => {
                if (e.target === closeSpan) return;
                loadTab(tab.id);
            };
            closeSpan.onclick = (e) => {
                e.stopPropagation();
                if (tabs.length === 1) {
                    tabs[0].url = '';
                    tabs[0].title = 'ӊөӎє';
                    loadTab(0);
                    return;
                }
                tabs = tabs.filter(t => t.id !== tab.id);
                if (activeTabId === tab.id) {
                    loadTab(tabs[0].id);
                } else {
                    updateTabsUI();
                }
            };
            tabsContainer.insertBefore(el, addTabBtn);
        });
    }

    function createNewTab() {
        const id = Date.now();
        tabs.push({ id, url: '', title: 'ҋєѡ ꚍдб' });
        loadTab(id);
    }

    function navigateTo(raw) {
        if (!requireProxy()) return;
        const url = normalizeUrl(raw);
        if (!url) return;
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab) return;
        tab.url = url;
        try {
            const host = new URL(url).hostname;
            tab.title = host || 'page';
        } catch {
            tab.title = url.slice(0, 20);
        }
        loadTab(activeTabId);
    }

    function reloadCurrent() {
        if (!requireProxy()) return;
        const tab = tabs.find(t => t.id === activeTabId);
        if (!tab || !tab.url) return;
        const proxyUrl = getEncodedProxyUrl(tab.url);
        if (proxyUrl) browserFrame.src = proxyUrl;
    }

    addTabBtn.onclick = createNewTab;
    document.getElementById('goBtn').onclick = () => navigateTo(urlInputElem.value);
    urlInputElem.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigateTo(urlInputElem.value); });
    document.getElementById('reloadBtn').onclick = reloadCurrent;
    document.querySelectorAll('.bookmark-item').forEach(el => {
        el.onclick = () => navigateTo(el.dataset.url);
    });

    // Settings and reset logic
    const settingsModal = document.getElementById('settings');
    document.getElementById('settingsNavBtn').onclick = () => { settingsModal.style.display = 'flex'; };
    document.getElementById('closeSettingsBtn').onclick = () => { settingsModal.style.display = 'none'; };
    document.getElementById('saveSettingsBtn').onclick = async () => {
        const newWs = document.getElementById('wsInput').value.trim();
        if (newWs) {
            localStorage.setItem("websocketURL", newWs);
            websocketURL = newWs;
            alert("Proxy URL saved. Reloading proxy...");
            proxyReady = false;
            scramjetReady = false;
            proxyInitPromise = null;
            await initProxyStack();
        }
        settingsModal.style.display = 'none';
    };
    document.getElementById('resetAllBtn').onclick = () => {
        localStorage.removeItem("websocketURL");
        websocketURL = DEFAULT_WS;
        document.getElementById('wsInput').value = DEFAULT_WS;
        alert("Reset to default proxy. Reloading...");
        proxyReady = false;
        scramjetReady = false;
        proxyInitPromise = null;
        initProxyStack().catch(console.warn);
    };
 

    // Initialize proxy and load home tab
    (async () => {
        await initProxyStack();
        loadTab(0);
    })();
</script>
</body>
</html>
