<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Source Code Fetcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eaeaea;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00d4ff;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            min-height: 24px;
        }

        .loading { color: #00d4ff; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }

        .output-container {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            display: none;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            align-items: center;
        }

        .toolbar button {
            padding: 8px 16px;
            font-size: 14px;
        }

        pre {
            max-height: 600px;
            overflow: auto;
            padding: 20px;
            margin: 0;
        }

        code {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #eaeaea;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 HTML Source Code Fetcher</h1>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://example.com)" />
            <button onclick="fetchHTML()">Fetch HTML</button>
        </div>
        
        <div id="status"></div>
        
        <div class="output-container" id="outputContainer">
            <div class="toolbar">
                <span id="lineCount" style="flex:1; color:#888;"></span>
                <button onclick="copyCode()">📋 Copy</button>
                <button onclick="downloadCode()">💾 Download</button>
                <button onclick="clearOutput()">🗑️ Clear</button>
            </div>
            <pre><code id="htmlOutput"></code></pre>
        </div>
    </div>

    <script>
        let currentHTML = '';

        async function fetchHTML() {
            const urlInput = document.getElementById('urlInput');
            const status = document.getElementById('status');
            let url = urlInput.value.trim();
            
            if (!url) {
                showStatus('Please enter a URL', 'error');
                return;
            }
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            showStatus('Fetching...', 'loading');
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                currentHTML = await response.text();
                
                // Escape for display
                document.getElementById('htmlOutput').textContent = currentHTML;
                
                const lines = currentHTML.split('\n').length;
                document.getElementById('lineCount').textContent = `${lines} lines`;
                document.getElementById('outputContainer').style.display = 'block';
                
                showStatus('✓ HTML fetched successfully!', 'success');
                
            } catch (error) {
                showStatus('Error: ' + error.message + ' (CORS may be blocked)', 'error');
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(currentHTML);
            showStatus('✓ Copied!', 'success');
        }

        function downloadCode() {
            const blob = new Blob([currentHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'source.html';
            a.click();
        }

        function clearOutput() {
            document.getElementById('outputContainer').style.display = 'none';
            currentHTML = '';
        }

        function showStatus(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = type;
        }

        // Enter key support
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchHTML();
        });
    </script>
</body>
</html>
