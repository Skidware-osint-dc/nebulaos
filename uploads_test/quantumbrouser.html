<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Browser</title>
<style>
:root{--bg:#0b0d12;--bar:#141821;--card:#1b202b;--border:#2b3240;--text:#eef2f7;--muted:#9aa5b5;--accent:#8b5cf6;--danger:#ef4444}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.browser{height:100%;display:flex;flex-direction:column}.tabbar{height:48px;display:flex;align-items:end;gap:6px;padding:7px 8px 0;background:#10131a;border-bottom:1px solid var(--border);overflow:auto}
.tab{height:40px;min-width:145px;max-width:230px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px 10px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.active{background:var(--card);color:var(--text);border:1px solid var(--border);border-bottom:0}.tab-title{overflow:hidden;text-overflow:ellipsis;flex:1}.close{background:none;border:0;color:inherit;font-size:18px;cursor:pointer}
.iconbtn,.newtab{background:transparent;border:0;color:var(--muted);cursor:pointer;border-radius:8px;padding:8px;font-size:17px}.iconbtn:hover,.newtab:hover{background:var(--card);color:var(--text)}
.toolbar{display:flex;align-items:center;gap:5px;padding:9px;background:var(--bar);border-bottom:1px solid var(--border)}.navbuttons{display:flex}
.addresswrap{position:relative;display:flex;align-items:center;flex:1}.address{width:100%;height:38px;border-radius:22px;border:1px solid var(--border);background:#0d1016;color:var(--text);padding:0 105px 0 40px;font-size:14px;outline:none}.address:focus{border-color:var(--accent);box-shadow:0 0 0 2px #8b5cf633}.searchicon{position:absolute;left:14px;color:var(--muted)}.go{position:absolute;right:5px;border:0;border-radius:17px;background:var(--accent);color:white;padding:7px 14px;cursor:pointer}
.content{display:flex;flex:1;min-height:0}.panel{width:300px;background:#11151d;border-right:1px solid var(--border);padding:16px;overflow:auto}.panel.hidden{display:none}.panel h2{margin:0 0 12px;font-size:16px}.item{padding:10px;border-radius:8px;cursor:pointer}.item:hover{background:var(--card)}.small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.remove{float:right;background:none;border:0;color:var(--danger);cursor:pointer}
.viewport{flex:1;min-width:0;display:flex;flex-direction:column}.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.logo{font-size:64px;filter:drop-shadow(0 0 18px #8b5cf699)}.quick button{border:1px solid var(--border);background:transparent;color:var(--muted);padding:9px 14px;border-radius:20px;margin:4px;cursor:pointer}.quick button:hover{border-color:var(--accent);color:white}
iframe{width:100%;height:100%;border:0;background:white}.source{margin:0;flex:1;overflow:auto;padding:16px;white-space:pre-wrap;color:#c4cedc;font-size:12px}.error{padding:15px;margin:15px;border:1px solid #ef444477;background:#ef444422;border-radius:10px}.status{min-height:30px;padding:7px 12px;background:#10131a;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px;align-items:center;overflow:hidden}.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{height:2px;background:var(--accent);animation:load 1.2s infinite}@keyframes load{0%{width:5%;margin-left:0}50%{width:45%;margin-left:30%}100%{width:5%;margin-left:95%}}
@media(max-width:700px){.toolbar{flex-wrap:wrap}.addresswrap{order:2;width:100%;flex-basis:100%}.panel{position:absolute;z-index:10;height:calc(100% - 100px);width:85%;box-shadow:8px 0 30px #000}.tab{min-width:120px}.toolbar .extra{display:none}}
</style>
</head>
<body>
<div class="browser">
  <div class="tabbar" id="tabbar"></div>
  <div class="toolbar">
    <div class="navbuttons">
      <button class="iconbtn" title="Back" onclick="back()">←</button>
      <button class="iconbtn" title="Forward" onclick="forward()">→</button>
      <button class="iconbtn" title="Reload" onclick="reloadPage()">↻</button>
      <button class="iconbtn" title="Home" onclick="home()">⌂</button>
    </div>
    <div class="addresswrap">
      <span class="searchicon">⌕</span><input id="address" class="address" placeholder="Search the web or enter an address" autocomplete="off" spellcheck="false">
      <button class="go" onclick="go()">Go</button>
    </div>
    <div class="extra">
      <button class="iconbtn" title="Bookmark" onclick="bookmark()">☆</button>
      <button class="iconbtn" title="View source" onclick="toggleSource()">&lt;/&gt;</button>
      <button class="iconbtn" title="Zoom out" onclick="zoom(-10)">−</button>
      <button class="iconbtn" title="Zoom in" onclick="zoom(10)">+</button>
      <button class="iconbtn" title="AI" onclick="togglePanel('ai')">✦</button>
      <button class="iconbtn" title="Bookmarks" onclick="togglePanel('bookmarks')">★</button>
      <button class="iconbtn" title="History" onclick="togglePanel('history')">◷</button>
    </div>
  </div>
  <div id="loading"></div>
  <div class="content">
    <aside id="panel" class="panel hidden"></aside>
    <main class="viewport" id="viewport"></main>
  </div>
  <div class="status"><span id="status">Ready · Standalone HTML mode</span><span id="statusurl"></span><span id="zoomstatus">Zoom 100%</span></div>
</div>
<script>
const HISTORY_KEY='quantum-browser-history', BOOKMARKS_KEY='quantum-browser-bookmarks';
let tabs=[newTab()], activeId=tabs[0].id, panel='none', view='page', zoomLevel=100;
let bookmarks=JSON.parse(localStorage.getItem(BOOKMARKS_KEY)||'[]');
let historyList=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
function newTab(address=''){return{id:Math.random().toString(36).slice(2),address,title:'New tab',history:[],index:-1,loading:false,error:'',source:''}}
function active(){return tabs.find(t=>t.id===activeId)||tabs[0]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTabs(){let b=document.getElementById('tabbar');b.innerHTML=tabs.map(t=>`<div class="tab ${t.id===activeId?'active':''}" onclick="activate('${t.id}')"><span>◉</span><span class="tab-title">${esc(t.title)}</span>${tabs.length>1?`<button class="close" onclick="event.stopPropagation();closeTab('${t.id}')">×</button>`:''}</div>`).join('')+`<button class="newtab" onclick="addTab()">＋</button>`}
function activate(id){activeId=id;view='page';render()}
function addTab(){let t=newTab();tabs.push(t);activeId=t.id;render()}
function closeTab(id){if(tabs.length===1)return;let i=tabs.findIndex(t=>t.id===id);tabs=tabs.filter(t=>t.id!==id);if(activeId===id)activeId=tabs[Math.max(0,i-1)].id;render()}
function normalize(raw){let v=raw.trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(\/|$|:\d)/.test(v)&&!v.includes(' '))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}
function go(){load(active().id,document.getElementById('address').value)}
function load(id,raw,mode='push'){let t=tabs.find(x=>x.id===id),url=normalize(raw);if(!t||!url)return;t.address=url;t.title='Loading…';t.error='';t.loading=true;document.getElementById('loading').className='loading';if(mode==='push'){t.history=t.history.slice(0,t.index+1);t.history.push(url);t.index=t.history.length-1}let h={url,title:url,at:Date.now()};historyList=[h,...historyList.filter(x=>x.url!==url)].slice(0,120);localStorage.setItem(HISTORY_KEY,JSON.stringify(historyList));render()}
function frameLoaded(){let t=active();if(!t.loading)return;t.loading=false;t.title=(()=>{try{return document.getElementById('pageframe').contentDocument.title||new URL(t.address).hostname}catch(e){return new URL(t.address).hostname}})();document.getElementById('loading').className='';renderTabs();document.getElementById('status').textContent='Loaded';}
function render(){renderTabs();let t=active(),vp=document.getElementById('viewport');document.getElementById('address').value=t.address;document.getElementById('zoomstatus').textContent='Zoom '+zoomLevel+'%';document.getElementById('statusurl').textContent=t.address;
if(!t.address){vp.innerHTML=`<div class="welcome"><div class="logo">⚛</div><h1>Start browsing privately</h1><p style="color:var(--muted);max-width:560px">Type a search or an address above. This standalone version recreates the Quantum Browser interface in one HTML file.</p><div class="quick"><button onclick="quick('https://www.google.com')">Google</button><button onclick="quick('https://wikipedia.org')">Wikipedia</button><button onclick="quick('https://github.com')">GitHub</button></div></div>`}
else if(view==='source'){vp.innerHTML='<pre class="source">'+esc(t.source||'Source viewing is available for pages loaded through a same-origin fetch/proxy. A standalone browser file cannot reliably fetch arbitrary websites because of browser CORS security.')+'</pre>'}
else {vp.innerHTML=`<iframe id="pageframe" src="${esc(t.address)}" onload="frameLoaded()" style="zoom:${zoomLevel/100}"></iframe>`}
renderPanel()}
function quick(url){document.getElementById('address').value=url;go()}
function back(){let t=active();if(t.index>0){t.index--;load(t.id,t.history[t.index],'replace')}}
function forward(){let t=active();if(t.index<t.history.length-1){t.index++;load(t.id,t.history[t.index],'replace')}}
function reloadPage(){let t=active();if(t.address)load(t.id,t.address,'replace')}
function home(){let t=active();t.address='';t.title='New tab';render()}
function bookmark(){let t=active();if(!t.address)return;if(bookmarks.some(b=>b.url===t.address)){alert('Already bookmarked.');return}bookmarks.unshift({id:Math.random().toString(36).slice(2),title:t.title||t.address,url:t.address});localStorage.setItem(BOOKMARKS_KEY,JSON.stringify(bookmarks));alert('Bookmarked!')}
function toggleSource(){view=view==='source'?'page':'source';render()}
function zoom(n){zoomLevel=Math.max(50,Math.min(180,zoomLevel+n));render()}
function togglePanel(p){panel=panel===p?'none':p;renderPanel()}
function renderPanel(){let el=document.getElementById('panel');if(panel==='none'){el.className='panel hidden';return}el.className='panel';if(panel==='bookmarks')el.innerHTML='<h2>Bookmarks</h2>'+(bookmarks.length?bookmarks.map(b=>`<div class="item" onclick="load(activeId,'${b.url.replace(/'/g,"\\'")}')"><button class="remove" onclick="event.stopPropagation();removeBookmark('${b.id}')">×</button><b>${esc(b.title)}</b><div class="small">${esc(b.url)}</div></div>`).join(''):'<p class="small">No bookmarks yet.</p>');
else if(panel==='history')el.innerHTML='<h2>History <button class="remove" onclick="clearHistory()">Clear</button></h2>'+(historyList.length?historyList.map(h=>`<div class="item" onclick="load(activeId,'${h.url.replace(/'/g,"\\'")}')"><b>${esc(h.title)}</b><div class="small">${esc(h.url)}</div></div>`).join(''):'<p class="small">Nothing here yet.</p>');
else el.innerHTML='<h2>✦ Quantum AI</h2><p class="small">AI integration requires an API/backend. This standalone HTML version keeps the browser UI without exposing API keys in the page.</p>'}
function removeBookmark(id){bookmarks=bookmarks.filter(b=>b.id!==id);localStorage.setItem(BOOKMARKS_KEY,JSON.stringify(bookmarks));renderPanel()}
function clearHistory(){historyList=[];localStorage.removeItem(HISTORY_KEY);renderPanel()}
document.getElementById('address').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
render();
</script>
</body>
</html>
